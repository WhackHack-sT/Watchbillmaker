<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchbill Builder</title>
  <meta name="description" content="Editable monthly and daily watchbill generator with qualification-aware scheduling, Inport/Underway transitions, and section-leader assignments." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230f263a'/%3E%3Cpath d='M15 18h34v28H15z' fill='%23fff'/%3E%3Cpath d='M21 13v10M43 13v10M15 27h34M22 34h7M35 34h7M22 40h7M35 40h7' stroke='%23255f8b' stroke-width='4'/%3E%3C/svg%3E" />
  <style>
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --ink: #16202a;
  --muted: #687481;
  --line: #d8dee5;
  --line-strong: #9aa5b1;
  --accent: #183a5a;
  --accent-2: #255f8b;
  --good: #1d6b45;
  --warn: #9a6411;
  --bad: #9e2f2f;
  --soft: #edf2f6;
  --shadow: 0 8px 24px rgba(20, 35, 50, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
button, input, select, textarea { font: inherit; }
button {
  border: 1px solid var(--line-strong);
  background: #fff;
  color: var(--ink);
  border-radius: 7px;
  padding: 8px 12px;
  cursor: pointer;
}
button:hover { background: #f6f8fa; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: var(--accent-2); }
button.danger { color: var(--bad); border-color: #d6a7a7; }
button.small { padding: 4px 8px; font-size: 12px; }
button.icon { width: 32px; height: 32px; padding: 0; }
.hidden { display: none !important; }
.topbar {
  min-height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 14px 22px;
  background: #0f263a;
  color: #fff;
  border-bottom: 1px solid #091725;
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand { font-weight: 800; letter-spacing: 0.08em; font-size: 20px; }
.subtitle { opacity: 0.75; font-size: 12px; margin-top: 3px; }
.top-actions { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; justify-content: flex-end; }
.compact-field { display: grid; gap: 3px; font-size: 11px; color: #d4dde6; }
.compact-field input { padding: 7px 9px; border-radius: 6px; border: 1px solid #728293; background: #fff; color: #111; }
.app-shell { display: grid; grid-template-columns: 210px minmax(0,1fr); min-height: calc(100vh - 78px); }
.sidebar { background: #172c3f; padding: 16px 10px; color: #fff; }
.nav-btn {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  color: #d7e1ea;
  background: transparent;
  padding: 10px 12px;
  margin-bottom: 4px;
  border-radius: 7px;
}
.nav-btn:hover, .nav-btn.active { color: #fff; background: #25465f; }
.sidebar-note { font-size: 11px; line-height: 1.45; color: #b9c9d6; padding: 16px 10px; margin-top: 18px; border-top: 1px solid #315068; }
.main-content { min-width: 0; padding: 20px; }
.page-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.page-heading h1 { font-size: 24px; margin: 0 0 4px; }
.page-heading p { margin: 0; color: var(--muted); font-size: 13px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 16px; }
.panel-header { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-body { padding: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(4, minmax(130px,1fr)); gap: 10px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 7px 8px;
  background: #fff;
  color: var(--ink);
  min-width: 0;
}
.field textarea { min-height: 72px; resize: vertical; }
.inline-field { display: flex; align-items: center; gap: 7px; }
.inline-field input, .inline-field select { border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; }
.table-wrap { overflow: auto; }
table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th { text-align: left; color: #42505c; background: #f5f7f9; position: sticky; top: 0; z-index: 1; }
.data-table th, .data-table td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: middle; }
.data-table tr:hover td { background: #fafbfd; }
.data-table input, .data-table select { width: 100%; border: 1px solid #c9d0d7; border-radius: 5px; padding: 5px 6px; background:#fff; }
.data-table input[type="checkbox"] { width: auto; }
.tag-list { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; padding: 2px 6px; border: 1px solid #b8c5d0; border-radius: 999px; background: #eef4f8; font-size: 11px; white-space: nowrap; }
.tag.muted { background:#f2f2f2; color:#67727c; border-color:#d5d5d5; }
.notice { border: 1px solid #d6dee6; border-left-width: 4px; border-radius: 7px; padding: 10px 12px; font-size: 12px; margin-bottom: 10px; background: #fff; }
.notice.good { border-left-color: var(--good); }
.notice.warn { border-left-color: var(--warn); background:#fffaf1; }
.notice.bad { border-left-color: var(--bad); background:#fff7f7; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.kpi { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 11px; min-width:125px; }
.kpi .label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.kpi .value { font-size:19px; font-weight:750; margin-top:1px; }
.split-layout { display:grid; grid-template-columns: 260px minmax(0,1fr); gap:14px; }
.list-card { background:#fff; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.list-card button { display:block; width:100%; border:0; border-radius:0; border-bottom:1px solid var(--line); text-align:left; padding:10px 12px; }
.list-card button.active { background:#e9f0f6; color:#113852; font-weight:700; }
.list-card button:last-child { border-bottom:0; }
.req-section { border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
.req-section h3 { margin:0; padding:9px 11px; font-size:13px; background:#f5f7f9; border-bottom:1px solid var(--line); }
.req-section .inside { padding:10px; }
.check-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; }
.check-pill { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:6px; padding:5px 7px; background:#fafbfc; font-size:11px; }
.color-chip { width:13px; height:13px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.15); vertical-align:-2px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.small-note { font-size:11px; color:var(--muted); line-height:1.45; }

/* workbook-style watchbill */
.watchbill-shell { overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; }
.watchbill-table {
  border-collapse: collapse;
  table-layout: fixed;
  background: #fff;
  color:#000;
  font-family: "Aptos Narrow", "Arial Narrow", Arial, sans-serif;
  width: max-content;
  min-width: 100%;
}
.watchbill-table .title-cell { font-size: 24px; height:55px; text-align:left; vertical-align:middle; font-weight:400; border:0; padding-left:6px; }
.watchbill-table th, .watchbill-table td { border:1px solid #8c8c8c; padding:1px 2px; height:19px; font-size:10px; }
.watchbill-table .name-col { width: 270px; min-width:270px; max-width:270px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.watchbill-table .day-col { width:30px; min-width:30px; max-width:30px; text-align:center; }
.watchbill-table .schedule-label { text-align:right; padding-right:6px; font-weight:400; }
.watchbill-table .schedule-segment { text-align:center; white-space:nowrap; overflow:hidden; font-size:9px; }
.watchbill-table .date-header { text-align:center; font-weight:400; }
.watchbill-table .division-row td { font-weight:700; background:#f4f4f4; border-top:1.5px solid #333; border-bottom:1.5px solid #333; }
.watchbill-table .division-row td:not(:first-child) { color:transparent; }
.watchbill-table .duty-cell { text-align:center; cursor:pointer; user-select:none; }
.watchbill-table .duty-cell.assigned { font-weight:800; background:#e9eef2; }
.watchbill-table .billet-mark { display:block; font-size:8px; line-height:0.92; white-space:nowrap; overflow:hidden; text-overflow:clip; letter-spacing:-0.15px; }
.watchbill-table .billet-mark.multi { font-size:7px; line-height:0.88; }
.watchbill-table .billet-mark.duty-only { font-size:6.5px; letter-spacing:-0.35px; }
.watchbill-table .duty-cell.forced-on { outline:2px solid #1f6a45; outline-offset:-2px; background:#e8f4ed; }
.watchbill-table .duty-cell.forced-off { color:#9a2f2f; background:#fff3f3; }
.watchbill-table .duty-cell.absent { font-weight:700; }
.watchbill-table .weekend { background:#fafafa; }
.watchbill-table .holiday { box-shadow: inset 0 3px 0 #b17a1c; }
.warning-list { margin:0; padding-left:18px; font-size:12px; }
.calendar-day-warning { color:var(--bad); font-weight:700; }
.transition-panel { border-left: 4px solid #255f8b; }
.transition-badge { display:inline-block; margin-top:4px; padding:2px 6px; border-radius:999px; background:#dbeafe; color:#17476b; font-size:10px; font-weight:700; white-space:nowrap; }
.selected-daily-row td { background:#edf5fb !important; }
.daily-layout { grid-template-columns:minmax(420px, .9fr) minmax(560px, 1.1fr); align-items:start; }
.daily-month-list { max-height:650px; }
.daily-watchbill-sheet {
  background:#fff;
  color:#101820;
  border:1px solid #9aa5b1;
  border-radius:8px;
  padding:24px;
  max-width:1000px;
  margin:0 auto 24px;
  box-shadow:var(--shadow);
  font-family:"Aptos", Arial, sans-serif;
}
.daily-sheet-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:3px solid #183a5a; padding-bottom:12px; margin-bottom:14px; }
.daily-sheet-kicker { font-size:12px; font-weight:800; letter-spacing:.12em; color:#526473; }
.daily-sheet-heading h1 { margin:4px 0 0; font-size:26px; }
.daily-sheet-status { background:#183a5a; color:#fff; font-weight:800; padding:9px 14px; border-radius:5px; }
.daily-meta-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
.daily-meta-grid > div { border:1px solid #b8c3cc; padding:8px 10px; min-height:52px; }
.daily-meta-grid span { display:block; text-transform:uppercase; letter-spacing:.07em; color:#60717e; font-size:9px; margin-bottom:3px; }
.daily-meta-grid strong { font-size:12px; }
.daily-transition { background:#eaf3fa; border:1px solid #8cb4d2; border-left:5px solid #255f8b; padding:9px 12px; margin:10px 0; font-size:12px; }
.daily-transition span { color:#526473; }
.daily-roster-table { width:100%; border-collapse:collapse; margin-top:10px; font-size:11px; }
.daily-roster-table th { background:#183a5a; color:#fff; text-align:left; }
.daily-roster-table th, .daily-roster-table td { border:1px solid #7d8a95; padding:6px 7px; }
.daily-roster-table th:first-child, .daily-roster-table td:first-child { width:32px; text-align:center; }
.daily-notes { border:1px solid #7d8a95; margin-top:12px; min-height:70px; padding:8px 10px; font-size:11px; }
.daily-notes strong { display:block; text-transform:uppercase; font-size:9px; letter-spacing:.08em; margin-bottom:5px; }
.daily-warning { border:1px solid #c88888; background:#fff5f5; padding:7px 9px; margin-top:10px; font-size:10px; }
.daily-signatures { display:grid; grid-template-columns:1fr 1fr; gap:50px; margin-top:38px; }
.daily-signatures div { border-top:1px solid #222; text-align:center; padding-top:4px; font-size:9px; color:#4f5d68; }

@media (max-width: 900px) {
  .app-shell { grid-template-columns:1fr; }
  .sidebar { display:flex; gap:5px; overflow:auto; padding:8px; position:sticky; top:78px; z-index:15; }
  .nav-btn { width:auto; white-space:nowrap; margin:0; }
  .sidebar-note { display:none; }
  .grid-2, .grid-3, .form-grid, .split-layout { grid-template-columns:1fr; }
  .daily-meta-grid { grid-template-columns:1fr 1fr; }
  .main-content { padding:12px; }
}

@media print {
  @page { size: Letter landscape; margin: 0.12in; }
  html, body { width:100%; height:auto; background:#fff; margin:0; padding:0; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .screen-only { display:none !important; }
  .app-shell { display:block; min-height:0; }
  .main-content { padding:0; margin:0; }
  .watchbill-shell {
    border:0; padding:0; margin:0; overflow:visible;
    width:100%;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .print-only-hide { display:none !important; }
  .watchbill-table { width:100%; table-layout:fixed; border-collapse:collapse; }
  .watchbill-table .title-cell { font-size:17pt; height:0.34in; padding-left:0.04in; line-height:1; }
  .watchbill-table th, .watchbill-table td {
    border:0.45pt solid #000;
    height:0.135in;
    min-height:0;
    font-size:5.8pt;
    line-height:1;
    padding:0 0.5pt;
  }
  .watchbill-table .name-col { width:1.90in; min-width:1.90in; max-width:1.90in; }
  .watchbill-table .day-col { width:auto; min-width:0; max-width:none; }
  .watchbill-table .schedule-segment { font-size:5.3pt; }
  .watchbill-table .schedule-label { padding-right:2px; }
  .watchbill-table .duty-cell { cursor:default; }
  .watchbill-table .billet-mark { font-size:4.7pt; line-height:0.88; letter-spacing:-0.18pt; }
  .watchbill-table .billet-mark.multi { font-size:4.1pt; line-height:0.82; }
  .watchbill-table .billet-mark.duty-only { font-size:3.8pt; letter-spacing:-0.25pt; }
  .watchbill-table .duty-cell.forced-off { color:#000; background:#fff; }
  .watchbill-table .duty-cell.forced-off .screen-mark { display:none; }
  .watchbill-table .holiday { box-shadow:none; }
}

@page daily { size: Letter portrait; margin: 0.35in; }

@media print {
  body.print-daily .daily-watchbill-sheet {
    page: daily;
    border:0;
    border-radius:0;
    box-shadow:none;
    padding:0;
    margin:0;
    max-width:none;
    width:100%;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  body.print-daily .daily-sheet-heading { margin-bottom:0.12in; padding-bottom:0.08in; }
  body.print-daily .daily-sheet-heading h1 { font-size:18pt; }
  body.print-daily .daily-sheet-kicker { font-size:8pt; }
  body.print-daily .daily-sheet-status { font-size:9pt; padding:0.07in 0.12in; }
  body.print-daily .daily-meta-grid { gap:0.05in; margin-bottom:0.08in; }
  body.print-daily .daily-meta-grid > div { min-height:0.38in; padding:0.05in 0.07in; }
  body.print-daily .daily-meta-grid span { font-size:6.5pt; }
  body.print-daily .daily-meta-grid strong { font-size:8.5pt; }
  body.print-daily .daily-transition { font-size:8pt; padding:0.06in 0.08in; margin:0.07in 0; }
  body.print-daily .daily-roster-table { font-size:8pt; margin-top:0.06in; }
  body.print-daily .daily-roster-table th, body.print-daily .daily-roster-table td { padding:0.035in 0.045in; }
  body.print-daily .daily-notes { min-height:0.55in; margin-top:0.08in; padding:0.06in; font-size:8pt; }
  body.print-daily .daily-warning { font-size:7pt; margin-top:0.06in; }
  body.print-daily .daily-signatures { margin-top:0.35in; gap:0.6in; }
}


/* approvals + editable formatting */
.approval-print {
  margin-top: 10px;
  border: 1px solid #666;
  padding: 8px 10px 10px;
  break-inside: avoid;
}
.approval-title {
  text-align: center;
  font-weight: 800;
  font-size: 11px;
  letter-spacing: .08em;
  margin-bottom: 8px;
}
.approval-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.approval-slot {
  display: grid;
  grid-template-columns: 1fr 60px;
  column-gap: 8px;
  row-gap: 2px;
  align-items: end;
}
.approval-role { grid-column: 1 / -1; text-align:center; font-size:10px; font-weight:800; }
.approval-name { grid-column: 1 / -1; text-align:center; min-height:16px; font-size:10px; }
.signature-line, .date-line { border-top: 1px solid #333; padding-top: 2px; color:#555; font-size:8px; text-align:center; }

@media print {
  .approval-print { margin-top: 0.035in; padding: 0.025in 0.05in 0.035in; border: 0.45pt solid #000; break-inside:avoid; page-break-inside:avoid; }
  .approval-title { font-size: 5.8pt; margin-bottom: 0.018in; line-height:1; }
  .approval-grid { gap: 0.045in; }
  .approval-slot { grid-template-columns:1fr 0.42in; column-gap:0.04in; row-gap:0; }
  .approval-role, .approval-name { font-size: 5.2pt; min-height:0.09in; line-height:1; }
  .signature-line, .date-line { font-size: 4.6pt; padding-top:1px; line-height:1; }
}

</style>
</head>
<body>
  <header class="topbar screen-only">
    <div>
      <div class="brand">WATCHBILL BUILDER</div>
      <div class="subtitle">Monthly and daily watchbills • editable transitions • qualification-aware scheduling</div>
    </div>
    <div class="top-actions">
      <label class="compact-field">Month <input id="monthPicker" type="month" /></label>
      <button id="generateBtn" class="primary">Generate Watchbill</button>
      <button id="printBtn" title="Print the finished watchbill or choose Save as PDF">Print / Save PDF</button>
      <button id="saveBtn">Save</button>
    </div>
  </header>

  <div class="app-shell">
    <nav class="sidebar screen-only" aria-label="Sections">
      <button class="nav-btn active" data-view="watchbill">Watchbill</button>
      <button class="nav-btn" data-view="calendar">Calendar</button>
      <button class="nav-btn" data-view="daily">Daily Watchbills</button>
      <button class="nav-btn" data-view="people">Personnel</button>
      <button class="nav-btn" data-view="requirements">Requirement Sets</button>
      <button class="nav-btn" data-view="absences">Leave / School / Other</button>
      <button class="nav-btn" data-view="specialdays">Weekends & Holidays</button>
      <button class="nav-btn" data-view="approvals">Approvals & Formatting</button>
      <button class="nav-btn" data-view="settings">Settings & Data</button>
      <div class="sidebar-note">
        <strong>Editable assignments</strong><br>
        Click an assigned cell to force that person off, or a blank cell to force them on. The generator rebalances the rest around your locked edits.
      </div>
    </nav>

    <main id="mainContent" class="main-content"></main>
  </div>

  <input id="importInput" class="hidden" type="file" accept="application/json,.json" />
  <!-- Source files are loaded in dependency order. See js/README.md for the map. -->

/**
 * 02-state-and-utilities.js
 * Application state, persistence, shared utilities, and page routing.
 * Loaded as a classic browser script so later modules can use these shared declarations.
 */

const STORAGE_KEY = "watchbillBuilder.v1";
const VERSION = 3;

const ui = {
  view: "watchbill",
  editPersonId: null,
  selectedRequirementId: null,
  dailyDateKey: null,
};

function uid(prefix = "id") {
  if (globalThis.crypto?.randomUUID) return `${prefix}_${crypto.randomUUID()}`;
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function esc(v) {
  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function clone(v) { return JSON.parse(JSON.stringify(v)); }
function pad2(n) { return String(n).padStart(2, "0"); }
function dateKey(year, month, day) { return `${year}-${pad2(month)}-${pad2(day)}`; }
function monthKey(year, month) { return `${year}-${pad2(month)}`; }
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
function monthLabel(year, month) { return new Date(year, month - 1, 1).toLocaleString(undefined, { month: "long", year: "numeric" }); }
function isWeekend(year, month, day) { const d = new Date(year, month - 1, day).getDay(); return d === 0 || d === 6; }
function normalizeQual(v) { return String(v ?? "").trim().toUpperCase(); }
function unique(arr) { return [...new Set(arr)]; }

function buildDefaultRequirements() {
  const commonMin = { SRO: 2, SEO: 1, SRW: 3 };
  const operational = { SRO: 2, SEO: 2, SRW: 2 };
  const make = (id, name, billets, preferredPersonnel = 0) => ({
    id, name, billets,
    qualificationMinimums: clone(commonMin),
    operationalMinimums: clone(operational),
    doubleFillRules: [{ id: uid("df"), anchorQualification: "ELT", maxAdditionalBillets: 1 }],
    minPersonnel: 0,
    preferredPersonnel,
  });
  return [
    make("req_lt24", "<24 Hr", [
      ["RO", ["RO"]], ["EO", ["EO"]], ["RT", ["RT"]], ["TH", ["TH"]],
      ["ERUL", ["ERUL"]], ["ERLL", ["ERLL"]], ["ERF", ["ERF"]], ["ELT", ["ELT"]],
    ].map(([name, eligibleQuals]) => ({ id: uid("billet"), name, count: 1, eligibleQuals })), 7),
    make("req_gt24", ">24 Hr", [
      ["RO", ["RO"]], ["EO", ["EO"]], ["ERUL", ["ERUL"]], ["ERLL", ["ERLL"]],
      ["ERF", ["ERF"]], ["ELT", ["ELT"]], ["SEO or RT", ["SEO", "RT"]],
    ].map(([name, eligibleQuals]) => ({ id: uid("billet"), name, count: 1, eligibleQuals })), 6),
    make("req_eval", "Eval", [
      ["RO", ["RO"]], ["EO", ["EO"]], ["ERUL", ["ERUL"]], ["ERLL", ["ERLL"]],
      ["ERF", ["ERF"]], ["ELT", ["ELT"]], ["SEO or RT", ["SEO", "RT"]],
    ].map(([name, eligibleQuals]) => ({ id: uid("billet"), name, count: 1, eligibleQuals })), 6),
  ];
}

function migrateState(raw) {
  const base = makeDefaultState();
  if (!raw || typeof raw !== "object") return base;
  return {
    ...base,
    ...raw,
    version: VERSION,
    schedulerSettings: { ...base.schedulerSettings, ...(raw.schedulerSettings || {}) },
    specialDaySettings: { ...base.specialDaySettings, ...(raw.specialDaySettings || {}) },
    approvalSettings: { ...base.approvalSettings, ...(raw.approvalSettings || {}) },
    formatting: {
      ...base.formatting, ...(raw.formatting || {}),
      qualificationColors: { ...base.formatting.qualificationColors, ...((raw.formatting || {}).qualificationColors || {}) },
      scheduleColors: { ...base.formatting.scheduleColors, ...((raw.formatting || {}).scheduleColors || {}) },
    },
    approvers: Array.isArray(raw.approvers) ? raw.approvers : base.approvers,
    qualifications: Array.isArray(raw.qualifications) ? raw.qualifications : base.qualifications,
    scheduleLabels: Array.isArray(raw.scheduleLabels) ? raw.scheduleLabels : base.scheduleLabels,
    dutySections: Array.isArray(raw.dutySections) ? raw.dutySections : base.dutySections,
    absenceTypes: Array.isArray(raw.absenceTypes) ? raw.absenceTypes : base.absenceTypes,
    requirements: (Array.isArray(raw.requirements) ? raw.requirements : base.requirements).map(r => ({
      ...r,
      preferredPersonnel: r.preferredPersonnel != null ? Number(r.preferredPersonnel) || 0 : (r.name === ">24 Hr" || r.name === "Eval" ? 6 : (r.name === "<24 Hr" ? 7 : 0)),
    })),
    people: Array.isArray(raw.people) ? raw.people : base.people,
    absences: Array.isArray(raw.absences) ? raw.absences : [],
    dayConfigs: raw.dayConfigs || {},
    manualOverrides: raw.manualOverrides || {},
    generated: raw.generated || {},
    dailyWatchbills: raw.dailyWatchbills || {},
    dailyWatchbillSettings: { ...base.dailyWatchbillSettings, ...(raw.dailyWatchbillSettings || {}) },
  };
}

function loadState() {
  if (typeof localStorage === "undefined") return makeDefaultState();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? migrateState(JSON.parse(raw)) : makeDefaultState();
  } catch (e) {
    console.warn("Could not load saved data", e);
    return makeDefaultState();
  }
}

let state = loadState();
ui.selectedRequirementId = state.requirements[0]?.id || null;
ui.editPersonId = state.people[0]?.id || null;

function saveState(showMessage = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (showMessage) flashSave();
  } catch (e) {
    alert("Could not save to browser storage. Export a JSON backup from Settings & Data.");
  }
}

function flashSave() {
  const b = document.getElementById("saveBtn");
  if (!b) return;
  const old = b.textContent;
  b.textContent = "Saved";
  setTimeout(() => b.textContent = old, 900);
}

function ensureMonthConfigs() {
  const { viewYear: y, viewMonth: m } = state;
  const n = daysInMonth(y, m);
  for (let d = 1; d <= n; d++) {
    const k = dateKey(y, m, d);
    if (!state.dayConfigs[k]) {
      state.dayConfigs[k] = {
        requirementSetId: state.requirements.find(r => r.name === ">24 Hr")?.id || state.requirements[0]?.id || "",
        scheduleLabel: state.scheduleLabels.includes("Inport") ? "Inport" : (state.scheduleLabels[0] || ""),
        dutySection: "",
        holiday: false,
        holidayName: "",
      };
    }
  }
}
ensureMonthConfigs();

function getRequirement(id) { return state.requirements.find(r => r.id === id); }
function getPerson(id) { return state.people.find(p => p.id === id); }
function getAbsenceType(id) { return state.absenceTypes.find(a => a.id === id); }
function currentMonthKeys() {
  const a = [];
  for (let d = 1; d <= daysInMonth(state.viewYear, state.viewMonth); d++) a.push(dateKey(state.viewYear, state.viewMonth, d));
  return a;
}
function dateWithin(key, start, end) { return key >= start && key <= end; }
function absenceFor(personId, key) {
  return state.absences.find(a => a.personId === personId && dateWithin(key, a.start, a.end));
}
function blocksDuty(personId, key) {
  const a = absenceFor(personId, key);
  return !!(a && getAbsenceType(a.typeId)?.blocksDuty);
}

function setView(view) {
  ui.view = view;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  render();
}

function render() {
  ensureMonthConfigs();
  document.getElementById("monthPicker").value = monthKey(state.viewYear, state.viewMonth);
  const main = document.getElementById("mainContent");
  if (ui.view === "calendar") renderCalendar(main);
  else if (ui.view === "daily") renderDailyWatchbills(main);
  else if (ui.view === "people") renderPeople(main);
  else if (ui.view === "requirements") renderRequirements(main);
  else if (ui.view === "absences") renderAbsences(main);
  else if (ui.view === "specialdays") renderSpecialDays(main);
  else if (ui.view === "approvals") renderApprovals(main);
  else if (ui.view === "settings") renderSettings(main);
  else renderWatchbill(main);
}

function pageHeading(title, description, actions = "") {
  return `<div class="page-heading screen-only"><div><h1>${esc(title)}</h1><p>${esc(description)}</p></div><div class="toolbar">${actions}</div></div>`;
}

function option(value, label, selected) {
  return `<option value="${esc(value)}" ${selected ? "selected" : ""}>${esc(label)}</option>`;
}

function groupPeopleByDivision() {
  const groups = [];
  const map = new Map();
  state.people.filter(p => p.active !== false).forEach(p => {
    const div = p.division || "UNASSIGNED";
    if (!map.has(div)) { const g = { division: div, people: [] }; map.set(div, g); groups.push(g); }
    map.get(div).people.push(p);
  });
  return groups;
}

function coverageCount(selectedIds, qual) {
  return selectedIds.reduce((n, id) => n + (getPerson(id)?.qualifications?.includes(qual) ? 1 : 0), 0);
}

function mergeRequirementSets(firstId, secondId) {
  const first = getRequirement(firstId), second = getRequirement(secondId);
  if (!first) return second;
  if (!second) return first;
  const billetMap = new Map();
  for (const billet of [...(first.billets || []), ...(second.billets || [])]) {
    const key = String(billet.name || "Billet").trim().toUpperCase();
    const existing = billetMap.get(key);
    if (!existing) billetMap.set(key, { ...clone(billet), id: `transition_${key.replace(/[^A-Z0-9]+/g, "_")}` });
    else {
      existing.count = Math.max(Number(existing.count) || 0, Number(billet.count) || 0);
      existing.eligibleQuals = unique([...(existing.eligibleQuals || []), ...(billet.eligibleQuals || [])]);
    }
  }
  const mergeMinimums = (a = {}, b = {}) => {
    const out = {};
    for (const q of unique([...Object.keys(a), ...Object.keys(b)])) out[q] = Math.max(Number(a[q]) || 0, Number(b[q]) || 0);
    return out;
  };
  const doubleFill = new Map();
  for (const rule of [...(first.doubleFillRules || []), ...(second.doubleFillRules || [])]) {
    const key = normalizeQual(rule.anchorQualification);
    const existing = doubleFill.get(key);
    if (!existing || Number(rule.maxAdditionalBillets) > Number(existing.maxAdditionalBillets)) {
      doubleFill.set(key, { ...clone(rule), id: `transition_df_${key}` });
    }
  }
  return {
    id: `transition:${first.id}:${second.id}`,
    name: `${first.name} → ${second.name}`,
    billets: [...billetMap.values()],
    qualificationMinimums: mergeMinimums(first.qualificationMinimums, second.qualificationMinimums),
    operationalMinimums: mergeMinimums(first.operationalMinimums, second.operationalMinimums),
    doubleFillRules: [...doubleFill.values()],
    minPersonnel: Math.max(Number(first.minPersonnel) || 0, Number(second.minPersonnel) || 0),
    // A transition combines two staffing profiles, so a single profile's preferred headcount is not a valid target.
    preferredPersonnel: 0,
  };
}

function effectiveRequirementForConfig(cfg) {
  if (cfg?.transition?.enabled) {
    return mergeRequirementSets(
      cfg.transition.beforeRequirementSetId || cfg.requirementSetId,
      cfg.transition.afterRequirementSetId || cfg.requirementSetId
    );
  }
  return getRequirement(cfg?.requirementSetId);
}

function requirementLabelForConfig(cfg) {
  return effectiveRequirementForConfig(cfg)?.name || "—";
}


/**
 * 03-monthly-watchbill.js
 * Monthly watchbill rendering and manual assignment overrides.
 * Loaded as a classic browser script so later modules can use these shared declarations.
 */

function renderWatchbill(main) {
  const keys = currentMonthKeys();
  const results = state.generated || {};
  const warningDays = keys.filter(k => results[k]?.warnings?.length);
  const generatedDays = keys.filter(k => results[k]).length;
  const totalAssignments = keys.reduce((n, k) => n + (results[k]?.selected?.length || 0), 0);
  const manualEditCount = keys.reduce((n,k) => n + Object.keys(state.manualOverrides[k] || {}).length, 0);
  const fmt = state.formatting || {};

  let notices = "";
  if (!generatedDays) notices = `<div class="notice warn screen-only">This month has not been generated yet. Click <strong>Generate Watchbill</strong>.</div>`;
  else if (warningDays.length) notices = `<div class="notice bad screen-only"><strong>${warningDays.length} day(s) have warnings.</strong> The schedule remains visible so you can see shortages or preferred-staffing exceptions.</div>`;
  else notices = `<div class="notice good screen-only">All generated days currently satisfy the configured billet and qualification minimum checks.</div>`;
  if (manualEditCount) notices += `<div class="notice good screen-only"><strong>${manualEditCount} manual assignment edit(s) are locked.</strong> Regeneration keeps those edits and rebalances the rest of the month around them.</div>`;

  const scheduleSegments = [];
  for (let d = 1; d <= keys.length; ) {
    const k = keys[d - 1];
    const label = state.dayConfigs[k]?.scheduleLabel || "";
    let end = d;
    while (end < keys.length && (state.dayConfigs[keys[end]]?.scheduleLabel || "") === label) end++;
    scheduleSegments.push({ label, span: end - d + 1 });
    d = end + 1;
  }

  let table = `<div class="watchbill-shell"><table class="watchbill-table"><colgroup><col class="name-col">${keys.map(() => '<col class="day-col">').join('')}</colgroup>`;
  table += `<thead><tr><th></th><th class="title-cell" colspan="${keys.length}">${esc(monthLabel(state.viewYear, state.viewMonth).replace(/\s\d{4}$/, ""))} Watchbill</th></tr>`;
  table += `<tr><th class="schedule-label">Schedule:</th>${scheduleSegments.map(seg => `<th class="schedule-segment" colspan="${seg.span}" style="background:${esc(fmt.scheduleColors?.[seg.label] || '#ffffff')}">${esc(seg.label)}</th>`).join("")}</tr>`;
  table += `<tr><th class="date-header">Roster</th>${keys.map((k, i) => {
    const r = results[k];
    const cfg = state.dayConfigs[k] || {};
    const wknd = isWeekend(state.viewYear, state.viewMonth, i + 1);
    const bg = cfg.holiday ? (fmt.holidayColor || '#fff2cc') : (wknd ? (fmt.weekendColor || '#f2f2f2') : '#ffffff');
    const cls = ["date-header", wknd ? "weekend" : "", cfg.holiday ? "holiday" : "", r?.warnings?.length ? "calendar-day-warning" : ""].filter(Boolean).join(" ");
    const holidayTitle = cfg.holiday ? `${cfg.holidayName || 'Holiday'}${r?.warnings?.length ? ' — ' : ''}` : '';
    const title = holidayTitle + (r?.warnings?.join("\n") || "");
    return `<th class="${cls}" style="background:${esc(bg)}" title="${esc(title)}">${i + 1}</th>`;
  }).join("")}</tr></thead><tbody>`;

  for (const group of groupPeopleByDivision()) {
    table += `<tr class="division-row"><td style="background:${esc(fmt.divisionColor || '#f4f4f4')}">${esc(group.division)}</td>${keys.map(() => `<td style="background:${esc(fmt.divisionColor || '#f4f4f4')}"></td>`).join('')}</tr>`;
    for (const p of group.people) {
      table += `<tr><td title="${esc(p.name)}">${esc(p.printLabel || p.name)}</td>`;
      for (let d = 1; d <= keys.length; d++) {
        const k = keys[d - 1];
        const cfg = state.dayConfigs[k] || {};
        const abs = absenceFor(p.id, k);
        const absType = abs ? getAbsenceType(abs.typeId) : null;
        const override = state.manualOverrides[k]?.[p.id] || "";
        const result = results[k];
        const selected = !!result?.selected?.includes(p.id);
        const billets = result?.billets?.[p.id] || [];
        const billetQuals = result?.billetQualifications?.[p.id] || [];
        const classes = ["duty-cell"];
        const wknd = isWeekend(state.viewYear, state.viewMonth, d);
        if (wknd) classes.push("weekend");
        if (cfg.holiday) classes.push("holiday");
        let text = "";
        let bg = cfg.holiday ? (fmt.holidayColor || '#fff2cc') : (wknd ? (fmt.weekendColor || '#f2f2f2') : '#ffffff');
        let title = billets.length ? `Billets: ${billets.join(", ")}${billetQuals.filter(Boolean).length ? ` (${billetQuals.filter(Boolean).join(', ')})` : ''}` : "";
        if (abs) {
          classes.push("absent");
          text = absType?.code || "A";
          bg = absType?.color || "#eee";
          title = `${absType?.name || "Unavailable"}${abs.note ? ` — ${abs.note}` : ""}`;
        } else if (selected) {
          classes.push("assigned");
          const billetLabels = billets.filter(Boolean);
          text = billetLabels.length
            ? `<span class="billet-mark${billetLabels.length > 1 ? ' multi' : ''}">${billetLabels.map(b => esc(b)).join("<br>")}</span>`
            : `<span class="billet-mark duty-only">DUTY</span>`;
          if (fmt.colorDutyByQualification !== false && billetQuals.filter(Boolean).length) {
            bg = fmt.qualificationColors?.[billetQuals.find(Boolean)] || fmt.assignedColor || '#e9eef2';
          } else bg = fmt.assignedColor || '#e9eef2';
          if (override === "on") classes.push("forced-on");
        } else if (override === "off") {
          classes.push("forced-off");
          text = `<span class="screen-mark">—</span>`;
          title = "Manually forced off this duty day";
        }
        table += `<td class="${classes.join(" ")}" style="background:${esc(bg)}" data-person="${esc(p.id)}" data-date="${k}" title="${esc(title)}">${text}</td>`;
      }
      table += `</tr>`;
    }
  }
  table += `</tbody></table>`;

  const enabledApprovers = (state.approvers || []).filter(a => a.enabled !== false);
  if (enabledApprovers.length) {
    table += `<div class="approval-print" style="background:${esc(fmt.approvalColor || '#ffffff')}"><div class="approval-title">${esc(state.approvalSettings?.title || 'WATCHBILL APPROVAL')}</div><div class="approval-grid">${enabledApprovers.map(a => `<div class="approval-slot"><div class="approval-role">${esc(a.role || 'Approver')}</div>${a.name ? `<div class="approval-name">${esc(a.name)}</div>` : '<div class="approval-name">&nbsp;</div>'}<div class="signature-line">Signature</div><div class="date-line">Date</div></div>`).join('')}</div></div>`;
  }
  table += `</div>`;

  let audit = `<div class="panel screen-only"><div class="panel-header">Daily coverage audit</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Day</th><th>Requirement</th><th>People</th><th>SRO</th><th>SEO</th><th>SRW</th><th>Status</th></tr></thead><tbody>`;
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i], r = results[k], req = effectiveRequirementForConfig(state.dayConfigs[k]);
    const ids = r?.selected || [];
    audit += `<tr><td>${i + 1}</td><td>${esc(req?.name || "—")}</td><td>${ids.length}${req?.preferredPersonnel ? ` / pref ${Number(req.preferredPersonnel)}` : ''}</td><td>${coverageCount(ids, "SRO")}</td><td>${coverageCount(ids, "SEO")}</td><td>${coverageCount(ids, "SRW")}</td><td>${r ? (r.warnings?.length ? `<span class="calendar-day-warning">${esc(r.warnings.join("; "))}</span>` : "OK") : "Not generated"}</td></tr>`;
  }
  audit += `</tbody></table></div></div>`;

  const carry = buildCarryStats(keys[0]);
  const monthCounts = {};
  state.people.forEach(p => monthCounts[p.id] = { duties:0, weekend:0, holiday:0 });
  keys.forEach((k,i) => {
    const cfg = state.dayConfigs[k] || {};
    (results[k]?.selected || []).forEach(id => {
      monthCounts[id] ||= {duties:0,weekend:0,holiday:0}; monthCounts[id].duties++;
      if (isWeekend(state.viewYear,state.viewMonth,i+1)) monthCounts[id].weekend++;
      if (cfg.holiday) monthCounts[id].holiday++;
    });
  });
  const fairnessRows = state.people.filter(p => p.active !== false).map(p => {
    const c=carry[p.id]||{duties:0,weekend:0,holiday:0}, m=monthCounts[p.id]||{duties:0,weekend:0,holiday:0};
    return `<tr><td>${esc(p.name)}</td><td>${c.duties}</td><td>${m.duties}</td><td>${c.duties+m.duties}</td><td>${c.weekend} + ${m.weekend}</td><td>${c.holiday} + ${m.holiday}</td></tr>`;
  }).join('');
  const fairness = `<div class="panel screen-only"><div class="panel-header">Fairness carry-over <span class="small-note">Prior ${Math.max(1,Number(state.schedulerSettings.historyMonths)||12)} month(s) + current month</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Person</th><th>Carry-in duties</th><th>This month</th><th>Combined</th><th>Weekend carry + month</th><th>Holiday carry + month</th></tr></thead><tbody>${fairnessRows}</tbody></table></div></div>`;

  main.innerHTML = pageHeading("Watchbill", "Click an assigned cell to remove/lock it off, or click a blank cell to add/lock that person on. The rest of the month automatically rebalances around your edits.", `<button id="regenHere" class="primary">Rebalance / Generate</button><button id="clearEdits">Clear Manual Edits</button><button id="printHere" title="Print the finished watchbill or choose Save as PDF">Print / Save PDF</button>`) +
    `<div class="kpis screen-only"><div class="kpi"><div class="label">Generated days</div><div class="value">${generatedDays}/${keys.length}</div></div><div class="kpi"><div class="label">Warning days</div><div class="value">${warningDays.length}</div></div><div class="kpi"><div class="label">Assignments</div><div class="value">${totalAssignments}</div></div><div class="kpi"><div class="label">Manual edits</div><div class="value">${manualEditCount}</div></div></div>` + notices + table + audit + fairness;

  document.getElementById("regenHere")?.addEventListener("click", () => { generateMonth(); saveState(); render(); });
  document.getElementById("clearEdits")?.addEventListener("click", () => {
    if (!manualEditCount || confirm("Clear all manual assignment edits for this month and rebalance automatically?")) {
      keys.forEach(k => delete state.manualOverrides[k]); generateMonth(); saveState(); render();
    }
  });
  document.getElementById("printHere")?.addEventListener("click", () => printWatchbillPdf());
  main.querySelectorAll(".duty-cell[data-person]").forEach(cell => cell.addEventListener("click", () => cycleManualOverride(cell.dataset.date, cell.dataset.person)));
}

function cycleManualOverride(k, personId) {
  if (absenceFor(personId, k)) return;
  state.manualOverrides[k] ||= {};
  const cur = state.manualOverrides[k][personId] || "";
  if (cur) delete state.manualOverrides[k][personId];
  else {
    const isCurrentlyAssigned = !!state.generated[k]?.selected?.includes(personId);
    state.manualOverrides[k][personId] = isCurrentlyAssigned ? "off" : "on";
  }
  if (!Object.keys(state.manualOverrides[k]).length) delete state.manualOverrides[k];
  generateMonth();
  saveState();
  render();
}


/**
 * 04-calendar-and-transitions.js
 * Calendar editing and Inport/Underway transition plans.
 * Loaded as a classic browser script so later modules can use these shared declarations.
 */

function renderCalendar(main) {
  const keys = currentMonthKeys();
  const reqOptions = state.requirements.map(r => option(r.id, r.name, false)).join("");
  const schedOptions = state.scheduleLabels.map(s => option(s, s, false)).join("");
  const dutyOptions = [`<option value="">Any / not fixed</option>`, ...state.dutySections.map(s => option(s, `Section ${s}`, false))].join("");
  const inport = state.scheduleLabels.find(s => s.toLowerCase() === "inport") || state.scheduleLabels[0] || "Inport";
  const underway = state.scheduleLabels.find(s => s.toLowerCase() === "underway") || state.scheduleLabels[1] || "Underway";
  const defaultReq = state.requirements.find(r => r.name === ">24 Hr")?.id || state.requirements[0]?.id || "";

  let rows = "";
  keys.forEach((k, i) => {
    const cfg = state.dayConfigs[k];
    const dt = new Date(state.viewYear, state.viewMonth - 1, i + 1);
    const dayName = dt.toLocaleString(undefined, { weekday: "short" });
    const result = state.generated[k];
    rows += `<tr>
      <td>${i + 1} <span class="small-note">${esc(dayName)}</span></td>
      <td><select data-day="${k}" data-field="requirementSetId">${state.requirements.map(r => option(r.id, r.name, r.id === cfg.requirementSetId)).join("")}</select>${cfg.transition?.enabled ? `<div class="transition-badge">Combined: ${esc(requirementLabelForConfig(cfg))}</div>` : ""}</td>
      <td><select data-day="${k}" data-field="scheduleLabel">${state.scheduleLabels.map(s => option(s, s, s === cfg.scheduleLabel)).join("")}</select></td>
      <td><select data-day="${k}" data-field="dutySection"><option value="">Any / not fixed</option>${state.dutySections.map(s => option(s, `Section ${s}`, s === cfg.dutySection)).join("")}</select></td>
      <td style="text-align:center"><input type="checkbox" data-day="${k}" data-field="holiday" ${cfg.holiday ? "checked" : ""}></td>
      <td>${cfg.transition?.enabled ? `<span class="transition-badge">${esc(cfg.transition.fromSchedule)} → ${esc(cfg.transition.toSchedule)}${cfg.transition.time ? ` @ ${esc(cfg.transition.time)}` : ""}</span> <button class="small" data-clear-transition="${k}">Clear</button>` : "—"}</td>
      <td>${result ? (result.warnings?.length ? `<span class="calendar-day-warning">${esc(result.warnings.join("; "))}</span>` : "OK") : "—"}</td>
    </tr>`;
  });

  main.innerHTML = pageHeading("Calendar", "Choose daily requirements or apply an Inport/Underway transition. The transition day is staffed against the combined requirements from both sides of the changeover.") + `
    <div class="panel screen-only transition-panel">
      <div class="panel-header">Inport / Underway transition</div>
      <div class="panel-body form-grid">
        <label class="field">Direction<select id="transitionDirection"><option value="out">Inport → Underway</option><option value="in">Underway → Inport</option></select></label>
        <label class="field">Transition day<input id="transitionDay" type="number" min="1" max="${keys.length}" value="${Math.min(keys.length, 15)}"></label>
        <label class="field">Transition time<input id="transitionTime" type="time" value="08:00"></label>
        <label class="field">Before-transition requirements<select id="transitionBeforeReq">${state.requirements.map(r => option(r.id, r.name, r.id === defaultReq)).join("")}</select></label>
        <label class="field">After-transition requirements<select id="transitionAfterReq">${state.requirements.map(r => option(r.id, r.name, r.id === defaultReq)).join("")}</select></label>
        <label class="field">Update days before<select id="transitionUpdateBefore"><option value="1">Yes</option><option value="0">No—transition day only</option></select></label>
        <label class="field">Update days after<select id="transitionUpdateAfter"><option value="1">Yes</option><option value="0">No—transition day only</option></select></label>
        <div class="field"><span>&nbsp;</span><button id="applyTransition" class="primary">Apply transition plan</button></div>
      </div>
      <div class="panel-body small-note">The transition date keeps both requirement sets. Its generated duty team must satisfy the stronger combined billet and qualification minimums.</div>
    </div>
    <div class="panel screen-only">
      <div class="panel-header">Bulk apply</div>
      <div class="panel-body form-grid">
        <label class="field">Start day<input id="bulkStart" type="number" min="1" max="${keys.length}" value="1"></label>
        <label class="field">End day<input id="bulkEnd" type="number" min="1" max="${keys.length}" value="${keys.length}"></label>
        <label class="field">Requirement set<select id="bulkReq"><option value="">Leave unchanged</option>${reqOptions}</select></label>
        <label class="field">Schedule<select id="bulkSchedule"><option value="">Leave unchanged</option>${schedOptions}</select></label>
        <label class="field">Duty section<select id="bulkSection"><option value="__unchanged__">Leave unchanged</option>${dutyOptions}</select></label>
        <div class="field"><span>&nbsp;</span><button id="bulkApply" class="primary">Apply to range</button></div>
        <label class="field">Rotation start section<select id="rotateStart">${state.dutySections.map(s => option(s, `Section ${s}`, false)).join("")}</select></label>
        <div class="field"><span>&nbsp;</span><button id="rotateSections">Rotate sections by day</button></div>
      </div>
    </div>
    <div class="panel"><div class="panel-header">${esc(monthLabel(state.viewYear, state.viewMonth))}</div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Day</th><th>Duty requirements</th><th>Schedule</th><th>Duty section</th><th>Holiday</th><th>Transition</th><th>Generated status</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;

  main.querySelectorAll("[data-day][data-field]").forEach(el => el.addEventListener("change", () => {
    const cfg = state.dayConfigs[el.dataset.day];
    cfg[el.dataset.field] = el.type === "checkbox" ? el.checked : el.value;
    clearGeneratedMonth();
    saveState();
    render();
  }));
  document.getElementById("bulkApply")?.addEventListener("click", () => {
    const start = Math.max(1, Math.min(keys.length, Number(document.getElementById("bulkStart").value) || 1));
    const end = Math.max(start, Math.min(keys.length, Number(document.getElementById("bulkEnd").value) || keys.length));
    const req = document.getElementById("bulkReq").value;
    const sched = document.getElementById("bulkSchedule").value;
    const section = document.getElementById("bulkSection").value;
    for (let d = start; d <= end; d++) {
      const cfg = state.dayConfigs[keys[d - 1]];
      if (req) cfg.requirementSetId = req;
      if (sched) cfg.scheduleLabel = sched;
      if (section !== "__unchanged__") cfg.dutySection = section;
    }
    clearGeneratedMonth(); saveState(); render();
  });
  document.getElementById("rotateSections")?.addEventListener("click", () => {
    if (!state.dutySections.length) return;
    const startValue = document.getElementById("rotateStart").value;
    let idx = Math.max(0, state.dutySections.indexOf(startValue));
    keys.forEach((k, i) => state.dayConfigs[k].dutySection = state.dutySections[(idx + i) % state.dutySections.length]);
    clearGeneratedMonth(); saveState(); render();
  });
  document.getElementById("applyTransition")?.addEventListener("click", () => {
    const direction = document.getElementById("transitionDirection").value;
    const fromSchedule = direction === "out" ? inport : underway;
    const toSchedule = direction === "out" ? underway : inport;
    applyTransitionPlan({
      day: Number(document.getElementById("transitionDay").value),
      time: document.getElementById("transitionTime").value,
      fromSchedule,
      toSchedule,
      beforeRequirementSetId: document.getElementById("transitionBeforeReq").value,
      afterRequirementSetId: document.getElementById("transitionAfterReq").value,
      updateBefore: document.getElementById("transitionUpdateBefore").value === "1",
      updateAfter: document.getElementById("transitionUpdateAfter").value === "1",
    });
    saveState(); render();
  });
  main.querySelectorAll("[data-clear-transition]").forEach(button => button.addEventListener("click", () => {
    const k = button.dataset.clearTransition;
    const cfg = state.dayConfigs[k];
    if (cfg?.transition) {
      cfg.scheduleLabel = cfg.transition.toSchedule || cfg.scheduleLabel;
      cfg.requirementSetId = cfg.transition.afterRequirementSetId || cfg.requirementSetId;
      delete cfg.transition;
      clearGeneratedMonth(); saveState(); render();
    }
  }));
}

function applyTransitionPlan(plan) {
  const keys = currentMonthKeys();
  const day = Math.max(1, Math.min(keys.length, Number(plan.day) || 1));
  const label = `${plan.fromSchedule} → ${plan.toSchedule}`;
  if (!state.scheduleLabels.includes(label)) state.scheduleLabels.push(label);
  state.formatting ||= {};
  state.formatting.scheduleColors ||= {};
  if (!state.formatting.scheduleColors[label]) state.formatting.scheduleColors[label] = "#d9e7f2";
  keys.forEach((k, index) => {
    const d = index + 1, cfg = state.dayConfigs[k];
    if (d < day && plan.updateBefore) {
      cfg.scheduleLabel = plan.fromSchedule;
      cfg.requirementSetId = plan.beforeRequirementSetId;
      delete cfg.transition;
    } else if (d === day) {
      cfg.scheduleLabel = label;
      cfg.requirementSetId = plan.afterRequirementSetId;
      cfg.transition = {
        enabled: true,
        fromSchedule: plan.fromSchedule,
        toSchedule: plan.toSchedule,
        time: plan.time || "",
        beforeRequirementSetId: plan.beforeRequirementSetId,
        afterRequirementSetId: plan.afterRequirementSetId,
      };
    } else if (d > day && plan.updateAfter) {
      cfg.scheduleLabel = plan.toSchedule;
      cfg.requirementSetId = plan.afterRequirementSetId;
      delete cfg.transition;
    }
  });
  clearGeneratedMonth();
}

function dailyDateLabel(k, options = {}) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    weekday: options.short ? "short" : "long",
    month: options.short ? "short" : "long",
    day: "numeric",
    year: options.short ? undefined : "numeric",
  });
}

function dailySourceSignature(k) {
  const result = state.generated[k] || {};
  return JSON.stringify({ selected: result.selected || [], billets: result.billets || {}, schedule: state.dayConfigs[k]?.scheduleLabel || "" });
}

function pickDailyLeader(k, counts = {}) {
  const assigned = state.generated[k]?.selected || [];
  const qual = normalizeQual(state.dailyWatchbillSettings?.leaderQualification || "");
  let candidates = assigned.map(getPerson).filter(Boolean).filter(p => !qual || (p.qualifications || []).includes(qual));
  if (!candidates.length) candidates = assigned.map(getPerson).filter(Boolean);
  if (!candidates.length) candidates = state.people.filter(p => p.active !== false && (!qual || (p.qualifications || []).includes(qual)));
  candidates.sort((a, b) => (counts[a.id] || 0) - (counts[b.id] || 0) || String(a.name).localeCompare(String(b.name)));
  return candidates[0]?.id || "";
}

function buildDailyWatchbill(k, forceRows = false, leaderCounts = {}) {
  const existing = state.dailyWatchbills[k] || {};
  if (existing.edited && !forceRows) return existing;
  const result = state.generated[k] || { selected: [], billets: {} };
  const rows = (result.selected || []).map(personId => ({
    id: uid("dailyrow"),
    personId,
    role: (result.billets?.[personId] || []).join(" + ") || "DUTY",
    watchStart: "",
    watchEnd: "",
    notes: "",
  }));
  const leaderId = existing.sectionLeaderId || pickDailyLeader(k, leaderCounts);
  const daily = {
    title: existing.title || state.dailyWatchbillSettings?.title || "DAILY DUTY SECTION WATCHBILL",
    sectionLeaderId: leaderId,
    musterTime: existing.musterTime ?? state.dailyWatchbillSettings?.defaultMusterTime ?? "",
    musterLocation: existing.musterLocation ?? state.dailyWatchbillSettings?.defaultMusterLocation ?? "",
    notes: existing.notes || "",
    rows,
    edited: false,
    sourceSignature: dailySourceSignature(k),
  };
  state.dailyWatchbills[k] = daily;
  return daily;
}

function ensureDailyWatchbills(keys = currentMonthKeys(), forceRows = false) {
  const counts = {};
  keys.forEach(k => {
    const id = state.dailyWatchbills[k]?.sectionLeaderId;
    if (id) counts[id] = (counts[id] || 0) + 1;
  });
  keys.forEach(k => {
    const before = state.dailyWatchbills[k]?.sectionLeaderId;
    const daily = buildDailyWatchbill(k, forceRows, counts);
    if (!before && daily.sectionLeaderId) counts[daily.sectionLeaderId] = (counts[daily.sectionLeaderId] || 0) + 1;
  });
}

function autoAssignDailyLeaders(overwrite = false) {
  const counts = {};
  for (const k of currentMonthKeys()) {
    const daily = state.dailyWatchbills[k] || buildDailyWatchbill(k, false, counts);
    if (overwrite || !daily.sectionLeaderId) daily.sectionLeaderId = pickDailyLeader(k, counts);
    if (daily.sectionLeaderId) counts[daily.sectionLeaderId] = (counts[daily.sectionLeaderId] || 0) + 1;
  }
}

/**
 * 11-settings-and-data.js
 * Qualification maintenance, settings, backup export, and invalidation.
 * Loaded as a classic browser script so later modules can use these shared declarations.
 */

function qualificationUsage(q) {
  let n = state.people.reduce((sum,p) => sum + ((p.qualifications || []).includes(q) ? 1 : 0), 0);
  state.requirements.forEach(r => {
    (r.billets || []).forEach(b => { if ((b.eligibleQuals || []).includes(q)) n++; });
    if ((r.qualificationMinimums || {})[q] != null) n++;
    if ((r.operationalMinimums || {})[q] != null) n++;
    (r.doubleFillRules || []).forEach(x => { if (x.anchorQualification === q) n++; });
  });
  return n;
}

function renameQualification(oldQ, newQ) {
  newQ = normalizeQual(newQ);
  if (!newQ || oldQ === newQ) return true;
  if (state.qualifications.includes(newQ)) { alert(`${newQ} already exists.`); return false; }
  state.qualifications = state.qualifications.map(q => q === oldQ ? newQ : q);
  state.formatting ||= {}; state.formatting.qualificationColors ||= {};
  if (state.formatting.qualificationColors[oldQ]) { state.formatting.qualificationColors[newQ] = state.formatting.qualificationColors[oldQ]; delete state.formatting.qualificationColors[oldQ]; }
  state.people.forEach(p => p.qualifications = unique((p.qualifications || []).map(q => q === oldQ ? newQ : q)));
  state.requirements.forEach(r => {
    (r.billets || []).forEach(b => b.eligibleQuals = unique((b.eligibleQuals || []).map(q => q === oldQ ? newQ : q)));
    for (const prop of ["qualificationMinimums", "operationalMinimums"]) {
      r[prop] ||= {};
      if (Object.prototype.hasOwnProperty.call(r[prop], oldQ)) { r[prop][newQ] = r[prop][oldQ]; delete r[prop][oldQ]; }
    }
    (r.doubleFillRules || []).forEach(x => { if (x.anchorQualification === oldQ) x.anchorQualification = newQ; });
  });
  clearGeneratedMonth();
  return true;
}

function removeQualification(q) {
  const use = qualificationUsage(q);
  if (use && !confirm(`${q} is referenced ${use} time(s). Remove it from people and requirement sets too?`)) return;
  state.qualifications = state.qualifications.filter(x => x !== q);
  if (state.formatting?.qualificationColors) delete state.formatting.qualificationColors[q];
  state.people.forEach(p => p.qualifications = (p.qualifications || []).filter(x => x !== q));
  state.requirements.forEach(r => {
    (r.billets || []).forEach(b => b.eligibleQuals = (b.eligibleQuals || []).filter(x => x !== q));
    delete (r.qualificationMinimums || {})[q]; delete (r.operationalMinimums || {})[q];

  });
  clearGeneratedMonth();
}

function clearGeneratedMonth() {
  // Preserve completed prior months as fairness history, but invalidate this month and later months because later fairness depends on earlier assignments.
  const first = currentMonthKeys()[0];
  Object.keys(state.generated || {}).forEach(k => { if (k >= first) delete state.generated[k]; });
}


/**
 * 12-scheduler.js
 * Fairness scoring, billet solving, validation, and month generation.
 * Loaded as a classic browser script so later modules can use these shared declarations.
 */

function dateOrdinal(key) {
  const [y,m,d] = String(key).split("-").map(Number);
  return Math.floor(Date.UTC(y, (m || 1) - 1, d || 1) / 86400000);
}
function historyStartKey(currentKey) {
  const months = Math.max(1, Number(state.schedulerSettings.historyMonths) || 12);
  const [y,m] = currentKey.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1 - months, 1));
  return dateKey(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 1);
}
function buildCarryStats(currentStartKey) {
  const stats = {};
  state.people.forEach(p => stats[p.id] = { duties: 0, weekend: 0, holiday: 0, lastOrdinal: null });
  if (state.schedulerSettings.carryFairness === false) return stats;
  const cutoff = historyStartKey(currentStartKey);
  Object.entries(state.generated || {}).forEach(([k, result]) => {
    if (k >= currentStartKey || k < cutoff || !result?.selected) return;
    const [y,m,d] = k.split("-").map(Number);
    const cfg = state.dayConfigs[k] || {};
    const wknd = isWeekend(y,m,d), hol = !!cfg.holiday;
    const ord = dateOrdinal(k);
    result.selected.forEach(id => {
      if (!stats[id]) stats[id] = { duties:0, weekend:0, holiday:0, lastOrdinal:null };
      stats[id].duties++;
      if (wknd) stats[id].weekend++;
      if (hol) stats[id].holiday++;
      stats[id].lastOrdinal = Math.max(stats[id].lastOrdinal ?? -Infinity, ord);
    });
  });
  return stats;
}
function candidateScore(person, stats, dayOrdinal, isWknd, isHol) {
  const s = stats[person.id] || { duties: 0, weekend: 0, holiday: 0, lastOrdinal: null };
  const even = state.schedulerSettings.preferEvenDistribution !== false;
  let score = even ? s.duties * 1000 : 0;
  if (isWknd) score += s.weekend * (Number(state.schedulerSettings.weekendWeight) || 0);
  if (isHol) score += s.holiday * (Number(state.schedulerSettings.holidayWeight) || 0);
  if (s.lastOrdinal != null) {
    const gap = dayOrdinal - s.lastOrdinal;
    score += Math.max(0, 5 - gap) * 8;
  }
  score += Math.max(0, state.people.indexOf(person)) / 1000;
  return score;
}

function divisionSpreadPenalty(person, selectedIds) {
  if (state.schedulerSettings.spreadDivisions === false) return 0;
  const weight = Math.max(0, Number(state.schedulerSettings.divisionSpreadWeight) || 0);
  if (!weight) return 0;
  const div = person.division || "UNASSIGNED";
  let sameDivision = 0;
  for (const id of selectedIds || []) {
    if (id === person.id) continue;
    const other = getPerson(id);
    if (other && (other.division || "UNASSIGNED") === div) sameDivision++;
  }
  return sameDivision * weight;
}

function availableCandidates(k, dayOrdinal, stats, ignoreRest, forcedOn, forcedOff) {
  const cfg = state.dayConfigs[k] || {};
  const minRest = Math.max(0, Number(state.schedulerSettings.minRestDays) || 0);
  return state.people.filter(p => {
    if (p.active === false || forcedOff.has(p.id) || blocksDuty(p.id, k)) return false;
    if (state.schedulerSettings.enforceDutySections && cfg.dutySection && p.dutySection !== cfg.dutySection && !forcedOn.has(p.id)) return false;
    if (!ignoreRest && !forcedOn.has(p.id) && minRest > 0) {
      const last = stats[p.id]?.lastOrdinal;
      if (last != null && dayOrdinal - last <= minRest) return false;
    }
    return true;
  });
}

function personMatchesSlot(person, slot) {
  const qs = person.qualifications || [];
  return (slot.eligibleQuals || []).some(q => qs.includes(q));
}

function canTakeAnotherPrimary(person, existingSlots, newSlot, req) {
  if (!existingSlots.length) return true;
  const combined = [...existingSlots, newSlot];
  let maxSlots = 1;
  for (const rule of (req.doubleFillRules || [])) {
    const anchor = rule.anchorQualification;
    if (!anchor || !(person.qualifications || []).includes(anchor)) continue;
    const anchorIsActuallyFilled = combined.some(s => (s.eligibleQuals || []).includes(anchor));
    if (anchorIsActuallyFilled) maxSlots = Math.max(maxSlots, 1 + Math.max(1, Number(rule.maxAdditionalBillets) || 1));
  }
  return existingSlots.length < maxSlots;
}

function makeSlots(req) {
  const slots = [];
  (req.billets || []).forEach(b => {
    const count = Math.max(0, Number(b.count) || 0);
    for (let i = 0; i < count; i++) slots.push({ id: `${b.id || b.name}_${i}`, name: b.name || "Billet", eligibleQuals: unique((b.eligibleQuals || []).map(normalizeQual).filter(Boolean)) });
  });
  return slots;
}

function canMeetCoverageWithinLimit(selectedIds, candidates, req, limit) {
  if (!limit) return true;
  const selected = new Set(selectedIds);
  if (selected.size > limit) return false;
  const mins = combinedMinimums(req);
  const minPeople = Math.max(0, Number(req.minPersonnel) || 0);
  const enoughNow = () => {
    if (selected.size < minPeople) return false;
    for (const [q, minRaw] of Object.entries(mins)) {
      const min = Math.max(0, Number(minRaw) || 0);
      let have = 0;
      selected.forEach(id => { if ((getPerson(id)?.qualifications || []).includes(q)) have++; });
      if (have < min) return false;
    }
    return true;
  };
  if (enoughNow()) return true;
  const remaining = candidates.filter(p => !selected.has(p.id));
  const maxAdds = Math.max(0, limit - selected.size);
  let nodes = 0;
  const dfs = (idx, addsLeft) => {
    if (enoughNow()) return true;
    if (addsLeft <= 0 || idx >= remaining.length || ++nodes > 20000) return false;
    // Try high-coverage candidates first.
    const p = remaining[idx];
    selected.add(p.id);
    if (dfs(idx + 1, addsLeft - 1)) return true;
    selected.delete(p.id);
    return dfs(idx + 1, addsLeft);
  };
  return dfs(0, maxAdds);
}

function assignPrimaryBillets(req, candidates, stats, dayOrdinal, wknd, hol, forcedOn = new Set()) {
  let slots = makeSlots(req);
  const baseScore = p => candidateScore(p, stats, dayOrdinal, wknd, hol) + (forcedOn.has(p.id) ? -250000 : 0);
  const rawScoredFor = slot => candidates.filter(p => personMatchesSlot(p, slot)).sort((a,b) => baseScore(a) - baseScore(b));
  slots = slots.sort((a,b) => rawScoredFor(a).length - rawScoredFor(b).length);
  const preferred = Math.max(0, Number(req.preferredPersonnel) || 0);
  const minPeople = Math.max(0, Number(req.minPersonnel) || 0);
  const limit = preferred ? Math.max(preferred, minPeople) : 0;

  const search = enforceLimit => {
    const assignments = {};
    let nodes = 0;
    const maxNodes = 240000;
    const recurse = idx => {
      if (idx >= slots.length) {
        const ids = Object.keys(assignments);
        if (enforceLimit && limit && !canMeetCoverageWithinLimit(ids, candidates, req, limit)) return false;
        return true;
      }
      if (++nodes > maxNodes) return false;
      const slot = slots[idx];
      const list = rawScoredFor(slot).slice().sort((a,b) => {
        const aReuse = (assignments[a.id] || []).length ? -1 : 0;
        const bReuse = (assignments[b.id] || []).length ? -1 : 0;
        // Valid double-fills are preferred so a >24 Hr set can reach a six-person solution when possible.
        if (aReuse !== bReuse) return aReuse - bReuse;
        const alreadySelected = unique([...Object.keys(assignments), ...forcedOn]);
        const aSpread = divisionSpreadPenalty(a, alreadySelected);
        const bSpread = divisionSpreadPenalty(b, alreadySelected);
        return (baseScore(a) + aSpread) - (baseScore(b) + bSpread);
      });
      for (const p of list) {
        const existing = assignments[p.id] || [];
        if (!canTakeAnotherPrimary(p, existing, slot, req)) continue;
        const isNew = existing.length === 0;
        if (enforceLimit && limit && isNew && Object.keys(assignments).length >= limit) continue;
        (assignments[p.id] ||= []).push(slot);

        let forwardOk = true;
        for (let j = idx + 1; j < slots.length && forwardOk; j++) {
          const future = slots[j];
          forwardOk = candidates.some(c => {
            const existingFuture = assignments[c.id] || [];
            if (enforceLimit && limit && !existingFuture.length && Object.keys(assignments).length >= limit) return false;
            return personMatchesSlot(c, future) && canTakeAnotherPrimary(c, existingFuture, future, req);
          });
        }
        if (forwardOk && recurse(idx + 1)) return true;
        assignments[p.id].pop();
        if (!assignments[p.id].length) delete assignments[p.id];
      }
      return false;
    };
    const complete = recurse(0);
    return { complete, assignments };
  };

  let solved = search(!!limit);
  let preferredTargetMissed = false;
  if (!solved.complete && limit) {
    preferredTargetMissed = true;
    solved = search(false);
  }
  if (solved.complete) return { assignments: solved.assignments, missingSlots: [], preferredTargetMissed };

  // Fall back to a best-effort partial schedule so shortages remain visible.
  const greedy = {};
  const missing = [];
  for (const slot of slots) {
    const list = rawScoredFor(slot).slice().sort((a,b) => {
      const ar = (greedy[a.id] || []).length ? -1 : 0;
      const br = (greedy[b.id] || []).length ? -1 : 0;
      if (ar !== br) return ar - br;
      const alreadySelected = unique([...Object.keys(greedy), ...forcedOn]);
      return (baseScore(a) + divisionSpreadPenalty(a, alreadySelected)) - (baseScore(b) + divisionSpreadPenalty(b, alreadySelected));
    });
    const p = list.find(x => canTakeAnotherPrimary(x, greedy[x.id] || [], slot, req));
    if (!p) missing.push(slot.name);
    else (greedy[p.id] ||= []).push(slot);
  }
  return { assignments: greedy, missingSlots: missing, preferredTargetMissed: true };
}

function combinedMinimums(req) {
  const out = {};
  for (const [q,n] of Object.entries(req.qualificationMinimums || {})) out[q] = Math.max(out[q] || 0, Number(n) || 0);
  for (const [q,n] of Object.entries(req.operationalMinimums || {})) out[q] = Math.max(out[q] || 0, Number(n) || 0);
  return out;
}

function addCoveragePeople(selected, candidates, req, stats, dayOrdinal, wknd, hol) {
  const mins = combinedMinimums(req);
  const selectedSet = new Set(selected);
  while (true) {
    const deficits = {};
    for (const [q, min] of Object.entries(mins)) {
      const have = [...selectedSet].reduce((n,id) => n + ((getPerson(id)?.qualifications || []).includes(q) ? 1 : 0), 0);
      if (have < min) deficits[q] = min - have;
    }
    if (!Object.keys(deficits).length) break;
    const choices = candidates.filter(p => !selectedSet.has(p.id)).map(p => {
      const benefit = Object.entries(deficits).reduce((n,[q,need]) => n + ((p.qualifications || []).includes(q) ? Math.min(1, need) : 0), 0);
      return { p, benefit, score: candidateScore(p, stats, dayOrdinal, wknd, hol) + divisionSpreadPenalty(p, selectedSet) };
    }).filter(x => x.benefit > 0).sort((a,b) => b.benefit - a.benefit || a.score - b.score);
    if (!choices.length) break;
    selectedSet.add(choices[0].p.id);
  }
  return [...selectedSet];
}

function addMinimumHeadcount(selected, candidates, req, stats, dayOrdinal, wknd, hol) {
  const need = Math.max(0, Number(req.minPersonnel) || 0);
  const set = new Set(selected);
  if (set.size >= need) return [...set];
  const choices = candidates.filter(p => !set.has(p.id)).sort((a,b) =>
    (candidateScore(a,stats,dayOrdinal,wknd,hol) + divisionSpreadPenalty(a,set)) -
    (candidateScore(b,stats,dayOrdinal,wknd,hol) + divisionSpreadPenalty(b,set))
  );
  for (const p of choices) { if (set.size >= need) break; set.add(p.id); }
  return [...set];
}

function validateDay(req, selected, missingSlots) {
  const warnings = [];
  if (missingSlots.length) warnings.push(`Unfilled billets: ${missingSlots.join(", ")}`);
  const checks = [
    ["Section", req.qualificationMinimums || {}],
    ["Operational", req.operationalMinimums || {}],
  ];
  for (const [label, mins] of checks) {
    for (const [q, minRaw] of Object.entries(mins)) {
      const min = Math.max(0, Number(minRaw) || 0);
      const have = coverageCount(selected, q);
      if (have < min) warnings.push(`${label} ${q}: ${have}/${min}`);
    }
  }
  const minPersonnel = Math.max(0, Number(req.minPersonnel) || 0);
  if (selected.length < minPersonnel) warnings.push(`Minimum people: ${selected.length}/${minPersonnel}`);
  return warnings;
}

function attemptDay(k, dayNum, stats, ignoreRest) {
  const cfg = state.dayConfigs[k] || {};
  const req = effectiveRequirementForConfig(cfg);
  if (!req) return { selected: [], billets: {}, billetQualifications: {}, warnings: ["No valid requirement set selected"], feasible: false };
  const overrideObj = state.manualOverrides[k] || {};
  const forcedOn = new Set(Object.entries(overrideObj).filter(([,v]) => v === "on").map(([id]) => id));
  const forcedOff = new Set(Object.entries(overrideObj).filter(([,v]) => v === "off").map(([id]) => id));
  const wknd = isWeekend(state.viewYear, state.viewMonth, dayNum), hol = !!cfg.holiday;
  const ord = dateOrdinal(k);
  const candidates = availableCandidates(k, ord, stats, ignoreRest, forcedOn, forcedOff);
  const forcedUnavailable = [...forcedOn].filter(id => !candidates.some(p => p.id === id));

  const primary = assignPrimaryBillets(req, candidates, stats, ord, wknd, hol, forcedOn);
  let selected = unique([...Object.keys(primary.assignments), ...[...forcedOn].filter(id => candidates.some(p => p.id === id))]);
  selected = addCoveragePeople(selected, candidates, req, stats, ord, wknd, hol);
  selected = addMinimumHeadcount(selected, candidates, req, stats, ord, wknd, hol);

  const billets = {};
  const billetQualifications = {};
  for (const [personId, slots] of Object.entries(primary.assignments)) {
    billets[personId] = slots.map(s => s.name);
    const person = getPerson(personId);
    billetQualifications[personId] = slots.map(s => (s.eligibleQuals || []).find(q => (person?.qualifications || []).includes(q)) || "");
  }
  const warnings = validateDay(req, selected, primary.missingSlots);
  const preferred = Math.max(0, Number(req.preferredPersonnel) || 0);
  if (preferred && selected.length > preferred) warnings.push(`Preferred staffing count exceeded: ${selected.length}/${preferred}`);
  if (forcedUnavailable.length) warnings.push(`Forced-on unavailable: ${forcedUnavailable.map(id => getPerson(id)?.name || id).join(", ")}`);
  const hardWarnings = warnings.filter(w => !w.startsWith("Forced-on unavailable") && !w.startsWith("Preferred staffing count exceeded"));
  return { selected, billets, billetQualifications, warnings, feasible: hardWarnings.length === 0 };
}

function generateMonth() {
  ensureMonthConfigs();
  const keys = currentMonthKeys();
  // Older months remain as fairness history. Current and later generated months are rebuilt in sequence so carry-over stays consistent.
  const first = keys[0], last = keys[keys.length - 1];
  Object.keys(state.generated || {}).forEach(k => { if (k >= first) delete state.generated[k]; });
  const stats = buildCarryStats(first);

  keys.forEach((k, i) => {
    const dayNum = i + 1;
    let result = attemptDay(k, dayNum, stats, false);
    if (!result.feasible && Number(state.schedulerSettings.minRestDays) > 0) {
      const relaxed = attemptDay(k, dayNum, stats, true);
      if (relaxed.feasible || relaxed.warnings.length <= result.warnings.length) {
        result = relaxed;
        result.warnings = [`Rest rule relaxed for this day`, ...result.warnings];
      }
    }
    state.generated[k] = { selected: unique(result.selected), billets: result.billets, billetQualifications: result.billetQualifications, warnings: result.warnings };
    const cfg = state.dayConfigs[k];
    const wknd = isWeekend(state.viewYear, state.viewMonth, dayNum), hol = !!cfg.holiday;
    const ord = dateOrdinal(k);
    result.selected.forEach(id => {
      if (!stats[id]) stats[id] = { duties:0, weekend:0, holiday:0, lastOrdinal:null };
      stats[id].duties++;
      if (wknd) stats[id].weekend++;
      if (hol) stats[id].holiday++;
      stats[id].lastOrdinal = ord;
    });
  });
  ensureDailyWatchbills(keys, false);
}


/**
 * 13-import-print-and-startup.js
 * Backup import, print actions, event wiring, and startup.
 * Loaded as a classic browser script so later modules can use these shared declarations.
 */

function importDataFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || ""));
      state = migrateState(parsed); ensureMonthConfigs();
      ui.selectedRequirementId = state.requirements[0]?.id || null;
      ui.editPersonId = state.people[0]?.id || null;
      saveState(); render();
    } catch (e) { alert("That file is not a valid Watchbill Builder JSON backup."); }
  };
  reader.readAsText(file);
}

function printWatchbillPdf() {
  if (!currentMonthKeys().every(k => state.generated[k])) generateMonth();
  saveState();
  document.body.classList.remove("print-daily");
  document.body.classList.add("print-monthly");
  ui.view = "watchbill";
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === "watchbill"));
  render();
  const oldTitle = document.title;
  const pdfTitle = `${monthLabel(state.viewYear, state.viewMonth)} Watchbill`;
  document.title = pdfTitle;
  setTimeout(() => {
    window.print();
    setTimeout(() => { document.title = oldTitle; document.body.classList.remove("print-monthly"); }, 250);
  }, 40);
}

function printDailyWatchbillPdf(k) {
  if (!state.generated[k]) generateMonth();
  buildDailyWatchbill(k, false, {});
  ui.dailyDateKey = k;
  ui.view = "daily";
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === "daily"));
  document.body.classList.remove("print-monthly");
  document.body.classList.add("print-daily");
  saveState(); render();
  const oldTitle = document.title;
  document.title = `${dailyDateLabel(k)} Daily Watchbill`;
  setTimeout(() => {
    window.print();
    setTimeout(() => { document.title = oldTitle; document.body.classList.remove("print-daily"); }, 250);
  }, 40);
}

// Global controls
if (typeof document !== "undefined") {
  for (const b of document.querySelectorAll(".nav-btn")) b.addEventListener("click", () => setView(b.dataset.view));
  document.getElementById("monthPicker").addEventListener("change", e => {
    const [y,m] = e.target.value.split("-").map(Number); if (!y || !m) return;
    state.viewYear = y; state.viewMonth = m; ensureMonthConfigs(); saveState(); render();
  });
  document.getElementById("generateBtn").addEventListener("click", () => { generateMonth(); saveState(); ui.view="watchbill"; document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view==="watchbill")); render(); });
  document.getElementById("printBtn").addEventListener("click", () => printWatchbillPdf());
  document.getElementById("saveBtn").addEventListener("click", () => saveState(true));
  document.getElementById("importInput").addEventListener("change", e => { const f=e.target.files?.[0]; if(f) importDataFile(f); e.target.value=""; });
  render();
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { generateMonth, getState: () => state, makeDefaultState, attemptDay, assignPrimaryBillets, buildCarryStats, dateOrdinal, setView, renderSpecialDays, renderApprovals, mergeRequirementSets, applyTransitionPlan, buildDailyWatchbill, autoAssignDailyLeaders };
}
